[env]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
upload_protocol = teensy-cli
build_flags =
    -Wall
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.5
    rweather/Crypto @ ^0.4.0

; Einsatz-Modus (Standard): kein Netzwerk, kein Webserver. Diese Firmware
; wird fuer echte Sitzungen geflasht -- absichtlich ohne jede Netzwerk-Library,
; damit ein Netzwerkstack waehrend einer Untersuchung nie versehentlich aktiv
; sein kann.
[env:teensy41]
lib_ignore =
    LabNetwork

; Labor-Modus: zusaetzlich nativer Ethernet-Port, NTP-Client, minimaler
; rein lesender Status-Webserver. Nur fuer Werkbank/Kalibrierung -- diese
; Variante nie fuer echte Sitzungen flashen (siehe README, "Labor-Modus").
[env:teensy41_lab]
build_flags =
    ${env.build_flags}
    -D LAB_MODE
lib_deps =
    ${env.lib_deps}
    ssilverman/QNEthernet @ ^0.31.0
